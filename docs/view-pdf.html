
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Corrected favicon path pointing up to root images directory -->
    <link rel="icon" type="image/png" href="../images/celta-favicon-512px.png">
    <title>CELTADeco — Services &amp; Presentation</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background-color: #525659; }
      object { width: 100%; height: 100%; border: none; }
      .fallback-msg { color: #fff; text-align: center; padding-top: 50px; font-family: sans-serif; }
      .fallback-msg a { color: #4da6ff; }
    </style>
  </head>
  <body>
    <object id="pdf-object" data="" type="application/pdf">
      <div class="fallback-msg">
        <p>Unable to display PDF directly in browser.</p>
        <p><a id="fallback-link" href="#">Click here to download the file directly.</a></p>
      </div>
    </object>
    
    <script>
      const params = new URLSearchParams(window.location.search);
      const pdfFile = params.get('file');
      if (pdfFile) {
        document.getElementById('pdf-object').data = pdfFile;
        document.getElementById('fallback-link').href = pdfFile;
      }
    </script>
  </body>
</html>
